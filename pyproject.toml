[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurintellect-agent"
version = "1.0.0"
description = "Local insurance-clause RAG demo with hybrid retrieval, cited answers, and regulated-advice refusal boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Phoenix0531-sudo/InsurIntellect-Agent"

[project.optional-dependencies]
local-models = ["langchain-huggingface>=0.1.0", "sentence-transformers>=3.0.0", "huggingface-hub>=0.23.0", "torch>=2.2.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "data/vector_db",
  "data/processed",
  "data/documents",
  "app/data",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using .httpx. with .starlette.testclient.:DeprecationWarning",
  "ignore:invalid escape sequence:DeprecationWarning",
  "ignore:pkg_resources is deprecated:DeprecationWarning",
]
