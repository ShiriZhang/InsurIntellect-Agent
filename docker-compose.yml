name: insurintellect-agent

services:
  app:
    image: insurintellect-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurintellect-agent
    ports:
      - "8766:8766"
    environment:
      HOST: 0.0.0.0
      PORT: 8766
      DEBUG: "true"
      SIMPLE_RAG_MODE: "true"
      ENABLE_QUERY_REWRITING: "false"
      ENABLE_QUERY_ROUTING: "false"
      CHROMA_ANONYMIZED_TELEMETRY: "false"
      CHROMA_DISABLE_TELEMETRY: "1"
      CHROMA_PERSIST_DIRECTORY: /app/data/vector_db/chroma
      PROCESSED_DATA_PATH: /app/data/processed
      PDF_STORAGE_PATH: /app/data/documents/pdfs
      DATABASE_URL: sqlite:////app/data/database/app.db
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      LOCAL_EMBEDDING_REVISION: ${LOCAL_EMBEDDING_REVISION:-}
      LOCAL_EMBEDDING_CACHE_DIR: /app/data/models
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-auto}
      LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-32}
      GENERATION_API_BASE_URL: ${GENERATION_API_BASE_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.32}
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port=os.getenv('PORT','8766'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health/live', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
